<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="사용량 평가의 도입과 되돌림 (보도 기준)" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>사용량 평가의 도입과 되돌림 (보도 기준)</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="560" fill="#F4F5F8"/><line x1="20" y1="268" x2="980" y2="268" stroke="#141C3C" stroke-width="2"/><rect x="521.0" y="256.0" width="32.0" height="24.0" rx="2" fill="#F4F5F8" stroke="none" stroke-width="0"/><path d="M524,278 L532,258 M542,278 L550,258" stroke="#141C3C" stroke-width="2" fill="none"/><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="20.0" y="24.0">평가에 넣었다 (2025)</tspan></text><text fill="#A87814" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="20.0" y="320.0">거둬들였다 (2026)</tspan></text><line x1="85" y1="128" x2="85" y2="260" stroke="#B8BFCE" stroke-width="1.6"/><rect x="12.0" y="40.0" width="176.0" height="88.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="100.0" y="71.4" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">Shopify · Duolingo</text><text x="100.0" y="92.2" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">AI 사용을 성과 평가에</text><text x="100.0" y="109.1" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">넣겠다는 메모</text><circle cx="85" cy="268" r="7" fill="#22315F"/><text fill="#5C6582" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="85.0" y="290.0">2025-04</tspan></text><line x1="215" y1="228" x2="215" y2="260" stroke="#B8BFCE" stroke-width="1.6"/><rect x="127.0" y="140.0" width="176.0" height="88.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="215.0" y="171.4" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">Microsoft 임원 메모</text><text x="215.0" y="192.2" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">"Using AI is no longer</text><text x="215.0" y="209.1" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">optional"</text><circle cx="215" cy="268" r="7" fill="#22315F"/><text fill="#5C6582" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="215.0" y="290.0">2025-06</tspan></text><line x1="345" y1="128" x2="345" y2="260" stroke="#B8BFCE" stroke-width="1.6"/><rect x="257.0" y="40.0" width="176.0" height="88.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="345.0" y="71.4" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">Coinbase</text><text x="345.0" y="92.2" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">주말까지 쓰라는 지시,</text><text x="345.0" y="109.1" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">따르지 않은 일부 해고</text><circle cx="345" cy="268" r="7" fill="#22315F"/><text fill="#5C6582" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="345.0" y="290.0">2025-08</tspan></text><line x1="475" y1="228" x2="475" y2="260" stroke="#B8BFCE" stroke-width="1.6"/><rect x="387.0" y="140.0" width="176.0" height="88.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="475.0" y="163.0" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">Meta</text><text x="475.0" y="183.8" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">2026년부터 AI-driven</text><text x="475.0" y="200.7" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">impact, 2025 평가엔 개인</text><text x="475.0" y="217.5" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">사용량 제외</text><circle cx="475" cy="268" r="7" fill="#22315F"/><text fill="#5C6582" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="475.0" y="290.0">2025-11</tspan></text><line x1="600" y1="276" x2="600" y2="338" stroke="#A87814" stroke-width="1.6"/><rect x="524.0" y="338.0" width="152.0" height="100.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="600.0" y="375.4" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">Duolingo</text><text x="600.0" y="396.2" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">성과 평가 지표에서 AI</text><text x="600.0" y="413.1" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">사용을 뺐다</text><circle cx="600" cy="268" r="7" fill="#A87814"/><text fill="#A87814" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="608.0" y="250.0">2026-04</tspan></text><line x1="760" y1="276" x2="760" y2="338" stroke="#A87814" stroke-width="1.6"/><rect x="684.0" y="338.0" width="152.0" height="100.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="760.0" y="375.4" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">Amazon</text><text x="760.0" y="396.2" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">직원들이 만든 비공식</text><text x="760.0" y="413.1" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">사용량 순위표 중단</text><circle cx="760" cy="268" r="7" fill="#A87814"/><text fill="#A87814" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="768.0" y="250.0">2026-05</tspan></text><line x1="915" y1="276" x2="915" y2="338" stroke="#A87814" stroke-width="1.6"/><rect x="838.0" y="338.0" width="152.0" height="100.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="914.0" y="367.0" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">Meta</text><text x="914.0" y="387.8" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">품질·속도·문제의</text><text x="914.0" y="404.7" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">복잡성으로 본다는</text><text x="914.0" y="421.5" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">메모</text><circle cx="915" cy="268" r="7" fill="#A87814"/><text fill="#A87814" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="923.0" y="250.0">2026-09</tspan></text><rect x="30.0" y="490.0" width="218.0" height="50.0" rx="25" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="139.0" y="520.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">쓰게 하려고 센다</text><path d="M251,515 L267,515" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="270.0" y="490.0" width="218.0" height="50.0" rx="25" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="379.0" y="520.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">부풀리기가 생긴다</text><path d="M491,515 L507,515" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="510.0" y="490.0" width="218.0" height="50.0" rx="25" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="619.0" y="520.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">숫자로 판단할 수 없게 된다</text><path d="M731,515 L747,515" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="750.0" y="490.0" width="218.0" height="50.0" rx="25" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="859.0" y="520.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">거둬들인다</text></svg>