<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="없앨 일 심사의 흐름과 다섯 갈래" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>없앨 일 심사의 흐름과 다섯 갈래</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="560" fill="#F4F5F8"/><rect x="30.0" y="40.0" width="260.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="160.0" y="83.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">일 목록</text><text x="160.0" y="106.9" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">자동화 후보로 올라온 일까지</text><rect x="30.0" y="186.0" width="260.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="160.0" y="232.3" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">세 자리를 부른다</text><text x="160.0" y="255.4" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">결과를 쓰는 요구자 · 결과 책임자 ·</text><text x="160.0" y="274.3" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">수행자, 리더가 소집</text><rect x="30.0" y="356.0" width="260.0" height="110.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="160.0" y="397.4" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">4주 시험 중단</text><text x="160.0" y="420.4" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">알리고 멈춘다. 누가 무엇을 찾는지</text><text x="160.0" y="439.3" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">기록한다</text><path d="M160.0,141.0 L160.0,179.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M160.0,311.0 L160.0,349.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><line x1="296" y1="411.0" x2="345" y2="411.0" stroke="#141C3C" stroke-width="2"/><line x1="345" y1="73.0" x2="345" y2="425.0" stroke="#141C3C" stroke-width="2"/><path d="M345,73 L393,73" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="400.0" y="40.0" width="150.0" height="66.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="475.0" y="79.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">없앤다</text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="568.0" y="73.0">결과를 아무도 쓰지 않으면</tspan></text><path d="M345,161 L393,161" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="400.0" y="128.0" width="150.0" height="66.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="475.0" y="167.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">합친다</text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="568.0" y="161.0">비슷한 결과를 내는 일이 둘이면</tspan></text><path d="M345,249 L393,249" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="400.0" y="216.0" width="150.0" height="66.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="475.0" y="255.7" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">줄인다</text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="568.0" y="249.0">결과 가운데 일부만 쓰이면</tspan></text><path d="M345,337 L393,337" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="400.0" y="304.0" width="150.0" height="66.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="475.0" y="343.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">자동화한다</text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="568.0" y="337.0">결과는 꼭 필요한데 손이 많이 가면</tspan></text><path d="M345,425 L393,425" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="400.0" y="392.0" width="150.0" height="66.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="475.0" y="431.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">그대로 둔다</text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="568.0" y="425.0">결과가 필요하고 사람이 하는 편이 나으면</tspan></text><line x1="399" y1="293.0" x2="975" y2="293.0" stroke="#A87814" stroke-width="1.6" stroke-dasharray="5 5"/><text fill="#A87814" font-size="13.5" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="975.0" y="281.0">자동화는 앞의 셋을 지난 뒤에 고른다</tspan></text><rect x="30.0" y="490.0" width="940.0" height="50.0" rx="10" fill="#F5E9CC" stroke="#A87814" stroke-width="1.6"/><text fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="515.0">멈추기 전에 되돌릴 조건을 적고, 없앤 자리에 생길 새 일을 이름 붙여 적는다</tspan></text></svg>