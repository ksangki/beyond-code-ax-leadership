<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="숨길 때, 사실만 밝힐 때, 들킬 때의 평가 방향과 확인 내역을 함께 밝히는 길" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>숨길 때, 사실만 밝힐 때, 들킬 때의 평가 방향과 확인 내역을 함께 밝히는 길</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="470" fill="#F4F5F8"/><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="300.0" y="34.0">평가 방향 (Schilke · Reimann 결과의 방향만)</tspan></text><rect x="30.0" y="60.0" width="170.0" height="340.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.5"/><text fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="92.0">숨김</tspan></text><line x1="50" y1="130" x2="180" y2="130" stroke="#B8BFCE" stroke-width="1.4" stroke-dasharray="5 5"/><text fill="#5C6582" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="52.0" y="120.0">처음 평가</tspan></text><path d="M60,170 L170,170" fill="none" stroke="#141C3C" stroke-width="3" marker-end="url(#mi)"/><path d="M115.0,216 L137.0,254 L93.0,254 Z" fill="#F5E9CC" stroke="#A87814" stroke-width="2"/><text fill="#A87814" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="240.0">!</tspan></text><text fill="#A87814" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="278.0">들킬 위험</tspan></text><text fill="#141C3C" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="360.0">들키기 전까지 변화 없음</tspan></text><rect x="215.0" 