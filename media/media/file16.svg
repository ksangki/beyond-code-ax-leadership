<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="우선순위 기여와 AI 경계로 나눈 네 영역" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>우선순위 기여와 AI 경계로 나눈 네 영역</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="520" fill="#F4F5F8"/><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="295.0" y="50.0">AI 경계 안</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="597.0" y="50.0">AI 경계 밖</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="133.0">우선순위</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="157.0">기여 높음</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="295.0">우선순위</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="319.0">기여 낮음</tspan></text><rect x="150.0" y="70.0" width="290.0" height="150.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="295.0" y="141.2" fill="#141C3C" font-size="20" font-weight="700" text-anchor="middle">먼저 바꾼다</text><text x="295.0" y="165.4" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">바꿀 후보</text><rect x="452.0" y="70.0" width="290.0" height="150.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="597.0" y="141.2" fill="#141C3C" font-size="20" font-weight="700" text-anchor="middle">작게 실험한다</text><text x="597.0" y="165.4" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">실험해 볼 후보</text><rect x="150.0" y="232.0" width="290.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="295.0" y="303.2" fill="#141C3C" font-size="20" font-weight="700" text-anchor="middle">없앨지 먼저 본다</text><text x="295.0" y="327.4" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">빠르게 할 후보로 보기 전에</text><rect x="452.0" y="232.0" width="290.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="597.0" y="303.2" fill="#141C3C" font-size="20" font-weight="700" text-anchor="middle">그대로 둔다</text><text x="597.0" y="327.4" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">서두를 이유가 없다</text><rect x="790.0" y="232.0" width="185.0" height="150.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="1.8"/><text x="882.5" y="284.2" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">9장 없앨 후보로</text><text x="882.5" y="306.1" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">우선순위 기여가 낮고 하지</text><text x="882.5" y="324.4" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">않아도 아무것도 멈추지</text><text x="882.5" y="342.6" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">않는 과업</text><path d="M295,388 L295,414 L750,414 L750,307 L783,307" fill="none" stroke="#A87814" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#mc)"/><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="488.0">경계 안·밖의 근거는 7장 일지. 일지에 없는 과업은 팀원에게 묻거나 짧게 시험해 보고 표시한다.</tspan></text></svg>