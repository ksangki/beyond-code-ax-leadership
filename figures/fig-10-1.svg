<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="확인 노동의 흐름: 배정에서 기록과 평가까지" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>확인 노동의 흐름: 배정에서 기록과 평가까지</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="500" fill="#F4F5F8"/><rect x="20.0" y="186.0" width="170.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="105.0" y="231.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">산출물</text><text x="105.0" y="254.9" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">에이전트·동료의 결과</text><rect x="230.0" y="176.0" width="190.0" height="120.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="325.0" y="231.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">확인자 배정</text><text x="325.0" y="254.9" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">순환 · 한 사람의 하루 상한</text><rect x="475.0" y="64.0" width="220.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="585.0" y="109.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">통과</text><text x="585.0" y="132.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">무엇을 봤는지 한 줄</text><rect x="475.0" y="192.0" width="220.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="585.0" y="228.7" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">반려</text><text x="585.0" y="250.9" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">사유 한 줄, 반려한 사람은</text><text x="585.0" y="269.1" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">불이익 없음</text><rect x="475.0" y="320.0" width="220.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="585.0" y="365.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">에스컬레이션</text><text x="585.0" y="388.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">위험 등급이 높은 것</text><path d="M195.0,236.0 L223.0,236.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M425.0,189.1 L468.0,168.9" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M425.0,238.3 L468.0,239.3" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M425.0,287.5 L474.4,313.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="750.0" y="120.0" width="230.0" height="110.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="865.0" y="161.3" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">기록</text><text x="865.0" y="184.5" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">배분표: 확인자 · 건수 · 반려 ·</text><text x="865.0" y="203.4" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">시간</text><rect x="750.0" y="300.0" width="230.0" height="110.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="865.0" y="350.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">평가 (16장)</text><text x="865.0" y="373.9" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">건수와 반려 기록이 근거가 된다</text><path d="M700.0,139.1 L743.0,148.4" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M700.0,214.5 L743.0,204.2" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M664.0,315.0 L776.0,237.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M865.0,235.0 L865.0,293.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M515,58 L515,30 L325,30 L325,169" fill="none" stroke="#141C3C" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mi)"/><text fill="#5C6582" font-size="13.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="529.0" y="30.0">표본 감사: 통과한 것 일부를 주기적으로 다시 본다</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="20.0" y="456.0">쏠림 신호: 확인이 한 사람에게 50% 넘게 몰린다(이 책이 제안하는 출발점),</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="20.0" y="480.0">또는 한 확인자의 반려가 몇 주째 없는데 건수만 는다.</tspan></text></svg>