<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="맡길 일을 고르는 두 가지 예상" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>맡길 일을 고르는 두 가지 예상</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="470" fill="#F4F5F8"/><text fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="590.0" y="30.0">확인 비용이 만드는 비용보다 작은가</tspan></text><text fill="#5C6582" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="397.0" y="66.0">아니다</tspan></text><text fill="#5C6582" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="783.0" y="66.0">그렇다</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="224.0">내가 이 일을</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="246.0">AI보다 잘하는가</tspan></text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="270.0">(맡기기 전 예상)</tspan></text><text fill="#5C6582" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="165.0">그렇다</tspan></text><text fill="#5C6582" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="115.0" y="327.0">아니다</tspan></text><path d="M115,200.0 L115,187.0" fill="none" stroke="#141C3C" stroke-width="1.6" marker-end="url(#mi)"/><path d="M115,292.0 L115,305.0" fill="none" stroke="#141C3C" stroke-width="1.6" marker-end="url(#mi)"/><rect x="210.0" y="90.0" width="374.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text fill="#141C3C" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="397.0" y="142.0">직접</tspan></text><text fill="#5C6582" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="397.0" y="178.0">판단은 내 손에 둔다</tspan></text><rect x="596.0" y="90.0" width="374.0" height="150.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text fill="#141C3C" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="783.0" y="142.0">함께</tspan></text><text fill="#5C6582" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="783.0" y="178.0">내가 앞에서 이끌고 부분을 맡긴다</tspan></text><rect x="596.0" y="252.0" width="374.0" height="150.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.2"/><text fill="#141C3C" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="783.0" y="304.0">맡김</tspan></text><text fill="#5C6582" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="783.0" y="340.0">결과만 확인 수단으로 본다</tspan></text><rect x="210.0" y="252.0" width="374.0" height="150.0" rx="12" fill="#E2E6F0" stroke="#22315F" stroke-width="2.2"/><text fill="#141C3C" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="397.0" y="304.0">보류</tspan></text><text fill="#5C6582" font-size="15" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="397.0" y="340.0">확인할 수단이 생기면 다른 칸으로</tspan></text><rect x="316.1" y="361.6" width="161.8" height="24.7" rx="12.35" fill="#FFFFFF" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="397.0" y="374.5">경력이 짧을수록 커진다</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="438.0">이 책의 제안 틀. 보류 칸은 경력이 짧을수록 크다. 그것이 정상이다.</tspan></text></svg>