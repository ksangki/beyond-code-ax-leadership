<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="관리자 층을 줄이는 소식과 관리자를 변수로 꼽는 조사" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>관리자 층을 줄이는 소식과 관리자를 변수로 꼽는 조사</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="520" fill="#F4F5F8"/><text fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="195.0" y="34.0">자리가 줄어드는 쪽</tspan></text><text fill="#A87814" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="805.0" y="34.0">관리자에게 기대는 쪽</tspan></text><rect x="30.0" y="60.0" width="330.0" height="112.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="195.0" y="101.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">Amazon</text><text x="195.0" y="124.6" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">2024-09, 관리자 대비 개인 기여자 비율을 15%</text><text x="195.0" y="144.2" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">이상 높이라는 지시(보도)</text><rect x="30.0" y="190.0" width="330.0" height="112.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="195.0" y="231.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">Google</text><text x="195.0" y="254.6" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">직속 부하 3명 미만 팀의 관리자를 1년 사이 35%</text><text x="195.0" y="274.2" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">줄임(2025-08 보도)</text><rect x="30.0" y="320.0" width="330.0" height="112.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="195.0" y="361.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">Gallup</text><text x="195.0" y="384.6" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">관리자 1명이 맡는 직속 부하 평균</text><text x="195.0" y="404.2" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">10.9명(2024) → 12.1명(2025), 중앙값 5~6명</text><rect x="640.0" y="60.0" width="330.0" height="112.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="805.0" y="101.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">Gallup</text><text x="805.0" y="124.6" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">관리자 지원에 강하게 동의한 직원, 주 몇 회</text><text x="805.0" y="144.2" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">이상 사용 1.7배</text><rect x="640.0" y="190.0" width="330.0" height="112.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="805.0" y="241.1" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">BCG 2025</text><text x="805.0" y="264.4" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">리더십 지원이 강할 때 긍정 인식 15% → 55%</text><rect x="640.0" y="320.0" width="330.0" height="112.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="805.0" y="361.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">Microsoft WTI 2026</text><text x="805.0" y="384.6" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">조직 요인 67%, 개인 요인 32% (벤더 자체</text><text x="805.0" y="404.2" fill="#5C6582" font-size="14.5" font-weight="400" text-anchor="middle">조사)</text><rect x="400.0" y="196.0" width="200.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#141C3C" stroke-width="1.8"/><text x="500.0" y="242.6" fill="#141C3C" font-size="20" font-weight="700" text-anchor="middle">관리자</text><text x="500.0" y="266.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">팀장·중간관리자의 자리</text><path d="M338.1,177.0 L393.0,200.4" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M365.0,246.0 L393.0,246.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M338.1,315.0 L393.0,291.6" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M605.0,201.2 L657.2,179.0" fill="none" stroke="#A87814" stroke-width="3" marker-end="url(#mc)"/><path d="M605.0,246.0 L633.0,246.0" fill="none" stroke="#A87814" stroke-width="3" marker-end="url(#mc)"/><path d="M605.0,290.8 L657.2,313.0" fill="none" stroke="#A87814" stroke-width="3" marker-end="url(#mc)"/><text fill="#5C6582" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="330.0">층은 얇게</tspan></text><text fill="#A87814" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="352.0">성패는 이 자리에</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="466.0">오른쪽 셋은 모두 상관관계다. 관리자가 지원하면 사용이 늘어난다는 인과까지는 말하지 않는다.</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="492.0">수치와 시점은 보도·조사 기준(표 1-1 참고).</tspan></text></svg>