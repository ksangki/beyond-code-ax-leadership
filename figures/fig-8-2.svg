<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="팀 업무 목록에서 결정 기록까지" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>팀 업무 목록에서 결정 기록까지</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="380" fill="#F4F5F8"/><rect x="30.0" y="40.0" width="214.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="137.0" y="91.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">팀 업무 목록</text><text x="137.0" y="114.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">팀이 하는 일을 한눈에</text><rect x="274.0" y="40.0" width="214.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="381.0" y="91.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">과업으로 쪼갠다</text><text x="381.0" y="114.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">협업 동작 · 경계 · 세 질문</text><rect x="518.0" y="40.0" width="214.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="625.0" y="91.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">업무 선택 질문지</text><text x="625.0" y="114.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">일곱 질문, 점수와 근거</text><rect x="762.0" y="40.0" width="214.0" height="112.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="869.0" y="91.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">결정 기록</text><text x="869.0" y="114.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">결정한 사람 · 날 · 다시 볼 날</text><path d="M249.0,96.0 L267.0,96.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M493.0,96.0 L511.0,96.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M737.0,96.0 L755.0,96.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="520.0" y="270.0" width="230.0" height="80.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="1.8"/><text x="635.0" y="316.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">9장 없앨 후보로</text><rect x="770.0" y="270.0" width="210.0" height="80.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="875.0" y="305.4" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">바꾼다 · 실험한다 · 보류</text><text x="875.0" y="327.4" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">다시 볼 날에 다시 본다</text><path d="M625,158 L625,263" fill="none" stroke="#A87814" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#mc)"/><text fill="#A87814" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="611.0" y="196.0">질문 7의 대답이</tspan></text><text fill="#A87814" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="611.0" y="218.0">"아무것도"면</tspan></text><text fill="#A87814" font-size="14" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="611.0" y="240.0">합계와 상관없이</tspan></text><path d="M909,158 L909,263" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M792,158 L792,226 L700,226 L700,263" fill="none" stroke="#A87814" stroke-width="3" marker-end="url(#mc)"/></svg>