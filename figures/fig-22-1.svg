<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="팀원을 붙잡아 두는 관리자와 옮겨 키우는 관리자 (워킹페이퍼 판본 기준)" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>팀원을 붙잡아 두는 관리자와 옮겨 키우는 관리자 (워킹페이퍼 판본 기준)</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="470" fill="#F4F5F8"/><rect x="20" y="20" width="470" height="350" rx="14" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text fill="#5C6582" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="36.0" y="42.0">붙잡아 두는 쪽</tspan></text><rect x="510" y="20" width="470" height="350" rx="14" fill="#F5E9CC" stroke="#A87814" stroke-width="1.8"/><text fill="#A87814" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="526.0" y="42.0">옮겨 키우는 쪽</tspan></text><rect x="44.0" y="60.0" width="422.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="255.0" y="105.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">팀 성과로만 평가받는 관리자</text><text x="255.0" y="128.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">유능한 직원을 붙잡아 둘 유인이 생긴다</text><rect x="44.0" y="186.0" width="422.0" height="160.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text fill="#5C6582" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" y="214.0">붙잡아 두기가 잠시 줄었을 때 (Haegele, 2022-02판)</tspan></text><text fill="#22315F" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" y="266.0">123%</tspan></text><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" y="312.0">직원들의 승진 지원 증가</tspan></text><rect x="534.0" y="60.0" width="422.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="745.0" y="105.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">좋은 관리자를 만난 직원</text><text x="745.0" y="128.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">사내 다른 자리로 더 많이 옮겨 갔다</text><rect x="534.0" y="186.0" width="422.0" height="160.0" rx="12" fill="#FFFFFF" stroke="#A87814" stroke-width="2"/><text fill="#5C6582" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="745.0" y="214.0">7년 뒤 (Minni, 2025-09판)</tspan></text><text fill="#A87814" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" y="266.0">40%</tspan></text><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" y="312.0">수평 이동 더 많음</tspan></text><text fill="#A87814" font-size="38" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="850.0" y="266.0">13%</tspan></text><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="850.0" y="312.0">연봉 더 높음</tspan></text><rect x="20.0" y="392.0" width="960.0" height="58.0" rx="12" fill="#FFFFFF" stroke="#141C3C" stroke-width="1.6" stroke-dasharray="6 5"/><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="421.0">이 책의 제안(추론): 리더 평가에 "사람을 기른 증거" 한 행을 둔다</tspan></text></svg>