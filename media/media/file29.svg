<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="사람 관리와 에이전트 관리가 겹치는 곳과 갈리는 곳" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>사람 관리와 에이전트 관리가 겹치는 곳과 갈리는 곳</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="500" fill="#F4F5F8"/><rect x="20.0" y="40.0" width="600.0" height="390.0" rx="20" fill="#E2E6F0" stroke="#22315F" stroke-width="2"/><rect x="380.0" y="40.0" width="600.0" height="390.0" rx="20" fill="#F5E9CC" stroke="#A87814" stroke-width="2"/><rect x="381" y="41" width="238" height="388" fill="#FFFFFF"/><line x1="380" y1="40" x2="380" y2="430" stroke="#A87814" stroke-width="2"/><line x1="620" y1="40" x2="620" y2="430" stroke="#22315F" stroke-width="2"/><text fill="#22315F" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="200.0" y="72.0">사람 관리</tspan></text><text fill="#A87814" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="800.0" y="72.0">에이전트 관리</tspan></text><text fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="72.0">겹치는 것</tspan></text><rect x="50.0" y="100.0" width="300.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="200.0" y="128.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">육성</text><text x="200.0" y="151.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">바쁠 때 가장 먼저 빠진다</text><rect x="50.0" y="180.0" width="300.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="200.0" y="208.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">신뢰</text><text x="200.0" y="231.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">실수를 털어놓아도 괜찮은 관계</text><rect x="50.0" y="260.0" width="300.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="200.0" y="288.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">방패</text><text x="200.0" y="311.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">위의 압력을 먼저 받아 낸다</text><rect x="50.0" y="340.0" width="300.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="200.0" y="368.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">배치</text><text x="200.0" y="391.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">누구에게 맡겨야 자라고 굴러가나</text><rect x="400.0" y="100.0" width="200.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="500.0" y="128.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">범위</text><text x="500.0" y="151.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">사람에게는 이유까지</text><rect x="400.0" y="180.0" width="200.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="500.0" y="208.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">기준</text><text x="500.0" y="231.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">무엇이 잘된 결과인가</text><rect x="400.0" y="260.0" width="200.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="500.0" y="288.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">중간 점검</text><text x="500.0" y="311.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">확인할 지점</text><rect x="400.0" y="340.0" width="200.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="500.0" y="379.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">결과 확인</text><rect x="650.0" y="100.0" width="300.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="800.0" y="128.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">지시문 고치기</text><text x="800.0" y="151.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">결과를 보고</text><rect x="650.0" y="180.0" width="300.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="800.0" y="208.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">등록 · 권한 · 소유자</text><text x="800.0" y="231.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">24장 팀 에이전트 목록표</text><rect x="650.0" y="260.0" width="300.0" height="66.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="800.0" y="288.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">인계자 · 내릴 조건</text><text x="800.0" y="311.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">24장 목록표에서 가져온다</text><text fill="#22315F" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="200.0" y="462.0">대화로만 할 수 있다</tspan></text><text fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="462.0">문서와 체크리스트로</tspan></text><text fill="#A87814" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="800.0" y="462.0">도구와 절차로 줄일 수 있다</tspan></text></svg>