text-anchor="middle" dominant-baseline="middle"><tspan x="790.0" y="102.0">함께 밝히는 길</tspan></text><rect x="634.0" y="128.0" width="312.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="790.0" y="161.6" fill="#141C3C" font-size="16.5" font-weight="700" text-anchor="middle">사용 범위</text><text x="790.0" y="183.7" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">AI가 한 부분</text><rect x="634.0" y="216.0" width="312.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="790.0" y="249.6" fill="#141C3C" font-size="16.5" font-weight="700" text-anchor="middle">확인한 것</text><text x="790.0" y="271.7" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">원자료와 대조한 곳</text><rect x="634.0" y="304.0" width="312.0" height="76.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="790.0" y="337.6" fill="#141C3C" font-size="16.5" font-weight="700" text-anchor="middle">확인하지 않은 것</text><text x="790.0" y="359.7" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">다시 볼 곳으로 표시</text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="440.0">수치 없이 방향만 표시했다. 오른쪽 상자는 이 책의 제안이다.</tspan></text></svg>