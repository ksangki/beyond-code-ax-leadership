<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-label="팀장 자리 여덟 장의 실천이 기준표를 거쳐 사람을 기른 증거로 이어지는 흐름" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>팀장 자리 여덟 장의 실천이 기준표를 거쳐 사람을 기른 증거로 이어지는 흐름</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="390" fill="#F4F5F8"/><rect x="27.0" y="30.0" width="208.0" height="130.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="131.0" y="81.7" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">팀장 자리 여덟 장의 실천</text><text x="131.0" y="103.9" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">시간 점검부터 창구 질문까지</text><text x="131.0" y="122.1" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">아홉 가지 도구</text><rect x="273.0" y="30.0" width="208.0" height="130.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="377.0" y="81.7" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">도구에 남은 기록</text><text x="377.0" y="103.9" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">일지 · 질문지 · 심사표 ·</text><text x="377.0" y="122.1" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">기록표 · 배분표 · 목록표</text><rect x="519.0" y="30.0" width="208.0" height="130.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="623.0" y="90.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">기준표의 행</text><text x="623.0" y="113.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">그 장의 기록이 증거 열이 된다</text><rect x="765.0" y="30.0" width="208.0" height="130.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="869.0" y="81.7" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">사람을 기른 증거</text><text x="869.0" y="103.9" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">10행: 실천을 다른 사람이</text><text x="869.0" y="122.1" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">이어받는다</text><path d="M240.0,95.0 L266.0,95.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M486.0,95.0 L512.0,95.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M732.0,95.0 L758.0,95.0" fill="none" stroke="#A87814" stroke-width="3" marker-end="url(#mc)"/><text fill="#5C6582" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="206.0">행마다 세 수준</tspan></text><rect x="160.0" y="226.0" width="200.0" height="52.0" rx="26" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="260.0" y="258.0" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">시작함</text><path d="M364,252 L404,252" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="410.0" y="226.0" width="200.0" height="52.0" rx="26" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="510.0" y="258.0" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">자리 잡음</text><path d="M614,252 L654,252" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="660.0" y="226.0" width="200.0" height="52.0" rx="26" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="760.0" y="258.0" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">넘겨줄 수 있음</text><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="320.0">기록이 없으면 그 행은 "시작함"보다 위로 매기지 않는다</tspan></text><text fill="#5C6582" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="350.0">열 행을 합산 점수로 만들지 않는다. 행마다 기록을 읽는다</tspan></text></svg>