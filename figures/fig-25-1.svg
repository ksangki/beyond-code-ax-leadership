<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="조직 에이전트의 수명주기와 단계마다 놓이는 최소 규칙 3개 범주" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>조직 에이전트의 수명주기와 단계마다 놓이는 최소 규칙 3개 범주</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="540" fill="#F4F5F8"/><line x1="124.0" y1="40" x2="124.0" y2="430" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="312.0" y1="40" x2="312.0" y2="430" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="500.0" y1="40" x2="500.0" y2="430" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="688.0" y1="40" x2="688.0" y2="430" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="876.0" y1="40" x2="876.0" y2="430" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><rect x="228.0" y="40.0" width="544.0" height="46.0" rx="10" fill="#E2E6F0" stroke="#22315F" stroke-width="1.6"/><text x="500.0" y="68.4" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">식별자: 등록부 이름, 소유자, 인계자</text><rect x="396.0" y="100.0" width="208.0" height="46.0" rx="10" fill="#E2E6F0" stroke="#22315F" stroke-width="1.6"/><text x="500.0" y="128.4" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">실시간 감시: 멈출 권한자</text><rect x="416.0" y="160.0" width="544.0" height="46.0" rx="10" fill="#E2E6F0" stroke="#22315F" stroke-width="1.6"/><text x="688.0" y="188.4" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">활동 기록: 감사 기록, 보관 기간, 쓰지 않을 곳</text><rect x="265.0" y="220.1" width="94.0" height="23.8" rx="11.875" fill="#F5E9CC" stroke="#A87814" stroke-width="1.4"/><text fill="#141C3C" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="312.0" y="232.5">승인 때 채움</tspan></text><rect x="641.0" y="220.1" width="94.0" height="23.8" rx="11.875" fill="#F5E9CC" stroke="#A87814" stroke-width="1.4"/><text fill="#141C3C" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="688.0" y="232.5">이동 때 갱신</tspan></text><rect x="40.0" y="262.0" width="168.0" height="74.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="124.0" y="304.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">만든 사람이 공유</text><circle cx="58.0" cy="278.0" r="11" fill="#22315F"/><text fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="58.0" y="278.5">1</tspan></text><rect x="228.0" y="262.0" width="168.0" height="74.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="312.0" y="304.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">회사 게시 승인</text><circle cx="246.0" cy="278.0" r="11" fill="#22315F"/><text fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="246.0" y="278.5">2</tspan></text><rect x="416.0" y="262.0" width="168.0" height="74.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="500.0" y="304.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">운영</text><circle cx="434.0" cy="278.0" r="11" fill="#22315F"/><text fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="434.0" y="278.5">3</tspan></text><rect x="604.0" y="262.0" width="168.0" height="74.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5" stroke-dasharray="7 5"/><text x="688.0" y="304.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">소유자 이동</text><circle cx="622.0" cy="278.0" r="11" fill="#22315F"/><text fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="622.0" y="278.5">4</tspan></text><rect x="792.0" y="262.0" width="168.0" height="74.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="876.0" y="304.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">인계 또는 내림</text><circle cx="810.0" cy="278.0" r="11" fill="#22315F"/><text fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="810.0" y="278.5">5</tspan></text><defs><marker id="m0x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker></defs><path d="M211,299.0 L223,299.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><path d="M399,299.0 L411,299.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><path d="M587,299.0 L599,299.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><path d="M775,299.0 L787,299.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><rect x="40.0" y="370.0" width="544.0" height="46.0" rx="10" fill="#F5E9CC" stroke="#A87814" stroke-width="1.6"/><text x="312.0" y="398.4" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">기여자 기록: 공유부터 운영까지 누적</text><rect x="250.6" y="426.1" width="122.8" height="23.8" rx="11.875" fill="#F5E9CC" stroke="#A87814" stroke-width="1.4"/><text fill="#141C3C" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="312.0" y="438.5">승인 때 처음 정리</tspan></text><path d="M688.0,360 L701.0,382 L675.0,382z" fill="#A87814"/><text fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="688.0" y="375.0">!</tspan></text><text x="688.0" y="400.2" fill="#A87814" font-size="13.5" font-weight="700" text-anchor="middle">부서 이동 시 소유자 칸이</text><text x="688.0" y="418.4" fill="#A87814" font-size="13.5" font-weight="700" text-anchor="middle">그대로 남는 공백(추론)</text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="500.0">3개 범주는 Chan 외(2024), 단계 배치는 이 책의 제안</tspan></text></svg>