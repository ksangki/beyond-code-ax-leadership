<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="리더가 먼저 돌리는 직접 사용 순환" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>리더가 먼저 돌리는 직접 사용 순환</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="600" fill="#F4F5F8"/><rect x="382.0" y="45.0" width="236.0" height="80.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="500.0" y="80.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">예상을 먼저 적는다</text><text x="500.0" y="103.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">결과와 걸릴 시간</text><rect x="698.1" y="152.5" width="236.0" height="80.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="816.1" y="188.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">맡겨서 써 본다</text><text x="816.1" y="210.5" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">회사가 허용한 도구·데이터 안에서</text><rect x="698.1" y="367.5" width="236.0" height="80.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="816.1" y="403.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">결과와 경계를 기록한다</text><text x="816.1" y="425.5" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">경계 안·밖, 고친 시간</text><rect x="382.0" y="475.0" width="236.0" height="80.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="500.0" y="510.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">팀에 공개한다</text><text x="500.0" y="533.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">틀린 경험도 같은 무게로</text><rect x="65.9" y="367.5" width="236.0" height="80.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="183.9" y="403.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">팀 규범이 바뀐다</text><text x="183.9" y="425.5" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">공개가 팀에서 안전한 일이 된다</text><rect x="65.9" y="152.5" width="236.0" height="80.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="183.9" y="188.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">다음에 써 볼 일이 달라진다</text><text x="183.9" y="210.5" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">경계가 움직이면 다시</text><path d="M624.0,127.2 L690.1,149.6" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M816.1,238.5 L816.1,359.5" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M692.1,449.7 L626.0,472.1" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M376.0,472.8 L309.9,450.4" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M183.9,361.5 L183.9,240.5" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M307.9,150.3 L374.0,127.9" fill="none" stroke="#A87814" stroke-width="3" marker-end="url(#mc)"/><text fill="#141C3C" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="286.0">리더가 먼저</tspan></text><text fill="#141C3C" font-size="19" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="314.0">돌리기 시작한다</tspan></text></svg>