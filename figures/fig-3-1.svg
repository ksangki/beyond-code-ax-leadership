<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="예상, 체감, 측정: METR 2025 실험의 완료 시간 변화" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>예상, 체감, 측정: METR 2025 실험의 완료 시간 변화</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="400" fill="#F4F5F8"/><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="610.0" y="32.0">완료 시간 변화</tspan></text><text fill="#141C3C" font-size="17" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="232.0" y="86.0">시작 전 예상</tspan></text><rect x="250.0" y="64.0" width="360.0" height="44.0" rx="6" fill="#22315F" stroke="none" stroke-width="1.5"/><text fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="264.0" y="86.0">−24%</tspan></text><text fill="#141C3C" font-size="17" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="232.0" y="158.0">실험 뒤 체감</tspan></text><rect x="310.0" y="136.0" width="300.0" height="44.0" rx="6" fill="#22315F" stroke="none" stroke-width="1.5"/><text fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="324.0" y="158.0">−20%</tspan></text><text fill="#141C3C" font-size="17" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="232.0" y="230.0">측정</tspan></text><rect x="610.0" y="208.0" width="285.0" height="44.0" rx="6" fill="#A87814" stroke="none" stroke-width="1.5"/><text fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="end" dominant-baseline="middle"><tspan x="881.0" y="230.0">+19%</tspan></text><line x