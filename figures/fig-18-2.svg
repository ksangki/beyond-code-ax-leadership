<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="하나의 창구와 그 뒤의 구조, 지점마다 리더가 물을 질문" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>하나의 창구와 그 뒤의 구조, 지점마다 리더가 물을 질문</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="500" fill="#F4F5F8"/><rect x="26.0" y="70.0" width="166.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="109.0" y="122.1" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">팀원</text><text x="109.0" y="144.7" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">창구로 일을 맡긴다</text><rect x="222.0" y="70.0" width="166.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="305.0" y="122.1" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">창구</text><text x="305.0" y="144.7" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">하나의 채팅 화면</text><rect x="418.0" y="70.0" width="166.0" height="112.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="501.0" y="113.0" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">통제면</text><text x="501.0" y="135.6" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">등록 · 관찰 · 권한 ·</text><text x="501.0" y="153.8" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">감사</text><rect x="614.0" y="70.0" width="166.0" height="112.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="697.0" y="122.1" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">에이전트들</text><text x="697.0" y="144.7" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">팀이 만든 것까지</text><rect x="810.0" y="70.0" width="166.0" height="112.0" rx="12" fill="#E2E6F0" stroke="#B8BFCE" stroke-width="1.8"/><text x="893.0" y="122.1" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">기록 시스템</text><text x="893.0" y="144.7" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">API · MCP로 열린다</text><path d="M197.0,126.0 L215.0,126.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M393.0,126.0 L411.0,126.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M589.0,126.0 L607.0,126.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M785.0,126.0 L803.0,126.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><circle cx="370.0" cy="70.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="370.0" y="70.5">7</tspan></text><circle cx="566.0" cy="70.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="566.0" y="70.5">6</tspan></text><circle cx="538.0" cy="70.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="538.0" y="70.5">5</tspan></text><circle cx="510.0" cy="70.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="510.0" y="70.5">1</tspan></text><circle cx="762.0" cy="70.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="762.0" y="70.5">8</tspan></text><circle cx="734.0" cy="70.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="734.0" y="70.5">2</tspan></text><circle cx="958.0" cy="70.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="958.0" y="70.5">7</tspan></text><rect x="14" y="36" width="972" height="166" rx="14" fill="none" stroke="#B8BFCE" stroke-width="1.8" stroke-dasharray="7 6"/><circle cx="36.0" cy="36.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="36.0" y="36.5">3</tspan></text><circle cx="64.0" cy="36.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="64.0" y="36.5">4</tspan></text><rect x="80.0" y="27.0" width="76.0" height="18.0" rx="2" fill="#F4F5F8" stroke="none" stroke-width="0"/><text fill="#5C6582" font-size="13" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="84.0" y="36.0">경로 전체</tspan></text><circle cx="42.0" cy="244.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="42.0" y="244.5">1</tspan></text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="64.0" y="244.0">누구의 권한으로 처리하나, 상한이 있나</tspan></text><circle cx="42.0" cy="294.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="42.0" y="294.5">2</tspan></text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="64.0" y="294.0">사람이 확인할 행동을 팀이 지정할 수 있나</tspan></text><circle cx="42.0" cy="344.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="42.0" y="344.5">3</tspan></text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="64.0" y="344.0">창구가 멈추면 팀은 어떻게 일하나</tspan></text><circle cx="42.0" cy="394.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="42.0" y="394.5">4</tspan></text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="64.0" y="394.0">한 달 비용, 예산은 누가 정하나</tspan></text><circle cx="527.0" cy="244.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="527.0" y="244.5">5</tspan></text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="549.0" y="244.0">감사 기록을 리더가 볼 수 있나, 평가에 쓰나</tspan></text><circle cx="527.0" cy="294.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="527.0" y="294.5">6</tspan></text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="549.0" y="294.0">등록 절차와 떠날 때의 인계</tspan></text><circle cx="527.0" cy="344.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="527.0" y="344.5">7</tspan></text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="549.0" y="344.0">화면에서 돕나, 뒤쪽에서 대신 처리하나</tspan></text><circle cx="527.0" cy="394.0" r="12" fill="#A87814"/><text fill="#FFFFFF" font-size="13.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="527.0" y="394.5">8</tspan></text><text fill="#141C3C" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="549.0" y="394.0">문제를 일으킨 에이전트를 누가 멈추나</tspan></text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="26.0" y="470.0">5번과 8번은 팀장이 대답을 받아 오는 질문이다. 회사 규칙을 바꾸려면 임원이 IT와 정한다.</tspan></text></svg>