xt><rect x="95.7" y="325.6" width="200.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="195.7" y="361.6" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">받은 팀의 결과 기록</text><rect x="211.9" y="124.4" width="200.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="311.9" y="160.4" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">평가 자료</text><rect x="588.1" y="124.4" width="200.0" height="60.0" rx="12" fill="#E2E6F0" stroke="#22315F" stroke-width="1.8"/><text x="688.1" y="160.4" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">평판</text><rect x="704.3" y="325.6" width="200.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="804.3" y="361.6" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">다시 도울 이유</text><text x="688.1" y="73.1" fill="#22315F" font-size="14" font-weight="700" text-anchor="middle">기여가 생기는 조건</text><text x="688.1" y="92.9" fill="#5C6582" font-size="13" font-weight="400" text-anchor="middle">Wasko · Faraj 2005, 회사 밖 전문가 네트워크, AI 이전</text><defs><marker id="m2x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5C6582"/></marker></defs><path d="M500,515.0 L500,560.0" fill="none" stroke="#5C6582" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m2x)"/><text fill="#5C6582" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="580.0">기록이 없을 때: 받은 팀의 성과로만 잡힘</tspan></text></svg>