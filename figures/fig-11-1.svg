<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="들어온 요청이 돕는 일 기록표의 한 줄이 되기까지" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>들어온 요청이 돕는 일 기록표의 한 줄이 되기까지</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="600" fill="#F4F5F8"/><rect x="30.0" y="70.0" width="140.0" height="100.0" rx="12" fill="#E2E6F0" stroke="#22315F" stroke-width="1.8"/><text x="100.0" y="108.0" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">들어온 요청</text><text x="100.0" y="129.2" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">직접 / 팀장 경유 /</text><text x="100.0" y="146.1" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">공식 통로</text><path d="M280,66 L354,120 L280,174 L206,120 Z" fill="#FFFFFF" stroke="#22315F" stroke-width="1.8"/><text fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="280.0" y="110.2">맡지 않는</tspan><tspan x="280.0" y="129.8">일인가?</tspan></text><path d="M452,66 L526,120 L452,174 L378,120 Z" fill="#FFFFFF" stroke="#22315F" stroke-width="1.8"/><text fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="452.0" y="110.2">이번 주 상한</tspan><tspan x="452.0" y="129.8">안인가?</tspan></text><path d="M624,66 L698,120 L624,174 L550,120 Z" fill="#FFFFFF" stroke="#22315F" stroke-width="1.8"/><text fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" y="110.2">팀장</tspan><tspan x="624.0" y="129.8">경유인가?</tspan></text><rect x="728.0" y="92.0" width="92.0" height="56.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="774.0" y="126.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">받음</text><rect x="210.0" y="232.0" width="140.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="280.0" y="259.9" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">거절</text><text x="280.0" y="280.6" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">맡을 곳 알려 주기</text><rect x="384.0" y="232.0" width="136.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="452.0" y="269.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">팀장에게 돌림</text><rect x="558.0" y="232.0" width="132.0" height="64.0" rx="12" fill="#F4F5F8" stroke="#141C3C" stroke-width="1.8" stroke-dasharray="7 5"/><text x="624.0" y="269.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">팀장에게 알림</text><path d="M280.0,300 L280.0,318 L852,318" fill="none" stroke="#5C6582" stroke-width="1.3" marker-end="url(#mi)"/><path d="M452.0,300 L452.0,318 L852,318" fill="none" stroke="#5C6582" stroke-width="1.3" marker-end="url(#mi)"/><text fill="#5C6582" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="560.0" y="332.0">거절한 요청도 적는다</tspan></text><path d="M175,120 L199,120" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M358,120 L371,120" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M530,120 L543,120" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M702,120 L721,120" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><text fill="#5C6582" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="366.0" y="106.0">아니오</tspan></text><text fill="#5C6582" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="538.0" y="106.0">예</tspan></text><path d="M280,178 L280,225" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><text fill="#5C6582" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="292.0" y="196.0">예</tspan></text><path d="M452,178 L452,225" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><text fill="#5C6582" font-size="12.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="464.0" y="196.0">아니오</tspan></text><path d="M624,178 L624,225" fill="none" stroke="#141C3C" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mi)"/><text fill="#5C6582" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="636.0" y="190.0">직접 들어온</tspan></text><text fill="#5C6582" font-size="12" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="636.0" y="206.0">요청이면</tspan></text><rect x="30.0" y="380.0" width="220.0" height="84.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="140.0" y="427.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">내 메모 · 기준을 나눔</text><rect x="290.0" y="380.0" width="220.0" height="84.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="400.0" y="417.4" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">옆 사람이 직접 맡기고</text><text x="400.0" y="438.3" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">확인함</text><rect x="550.0" y="380.0" width="230.0" height="84.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="665.0" y="417.4" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">1~2주 뒤 그 사람의</text><text x="665.0" y="438.3" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">말로 바뀐 것</text><rect x="86.8" y="452.1" width="106.5" height="23.8" rx="11.875" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.4"/><text fill="#141C3C" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="140.0" y="464.5">민감 정보 지움</tspan></text><rect x="348.6" y="452.1" width="102.8" height="23.8" rx="11.875" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.4"/><text fill="#141C3C" font-size="12.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="400.0" y="464.5">막히면 힌트만</tspan></text><path d="M774.0,152 L774.0,345 L140,345 L140,373" fill="none" stroke="#F4F5F8" stroke-width="9"/><path d="M774.0,152 L774.0,345 L140,345 L140,373" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M255.0,422.0 L283.0,422.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M515.0,422.0 L543.0,422.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="860.0" y="50.0" width="110.0" height="500.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="915.0" y="283.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">돕는 일</text><text x="915.0" y="306.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">기록표의</text><text x="915.0" y="329.3" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">한 줄</text><path d="M785,422.0 L852,422.0" fill="none" stroke="#A87814" stroke-width="3" marker-end="url(#mc)"/><path d="M60,468 L60,525 L852,525" fill="none" stroke="#5C6582" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#mi)"/><text fill="#5C6582" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="450.0" y="512.0">대신 함 (나눈 일과 칸을 나눠 적는다)</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="576.0">갈림의 순서와 네 걸음은 이 책의 제안</tspan></text></svg>