<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="과업 이득은 최종 산출로 가며 줄었다: 커밋 240%, 프로젝트 80%, 출시 30%" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>과업 이득은 최종 산출로 가며 줄었다: 커밋 240%, 프로젝트 80%, 출시 30%</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="520" fill="#F4F5F8"/><path d="M100.0,40 L740.0,40 L680.0,136 L160.0,136z" fill="#22315F"/><text fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="420.0" y="88.0">커밋 +240%</tspan></text><line x1="722.0" y1="88.0" x2="779" y2="88.0" stroke="#B8BFCE" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="800.8" y="73.8" width="88.5" height="28.5" rx="14.25" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="845.0" y="88.5">과업 단위</tspan></text><path d="M170.0,150 L670.0,150 L610.0,246 L230.0,246z" fill="#4A5884"/><text fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="420.0" y="198.0">프로젝트 수 +80%</tspan></text><line x1="652.0" y1="198.0" x2="779" y2="198.0" stroke="#B8BFCE" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="800.8" y="183.8" width="88.5" height="28.5" rx="14.25" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="845.0" y="198.5">중간 산출</tspan></text><path d="M240.0,260 L600.0,260 L540.0,356 L300.0,356z" fill="#A87814"/><text fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="420.0" y="308.0">실제 출시 +30%</tspan></text><line x1="582.0" y1="308.0" x2="779" y2="308.0" stroke="#B8BFCE" stroke-width="1.6" stroke-dasharray="5 5"/><rect x="800.8" y="293.8" width="88.5" height="28.5" rx="14.25" fill="#F5E9CC" stroke="#A87814" stroke-width="1.4"/><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="845.0" y="308.5">최종 산출</tspan></text><rect x="250.0" y="384.0" width="340.0" height="50.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="420.0" y="415.0" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">인력 판단에 쓸 숫자는 어느 단인가?</text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="470.0">Demirer 외, NBER w35275, 2026년 9월 개정판 초록. 자율 코딩 에이전트의 누적 효과.</tspan></text><text fill="#5C6582" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="494.0">세 단의 폭은 크기 비례가 아니다.</tspan></text></svg>