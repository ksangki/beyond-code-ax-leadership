<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="실패 한 건이 카드가 되어 가는 두 갈래" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>실패 한 건이 카드가 되어 가는 두 갈래</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="480" fill="#F4F5F8"/><rect x="30.0" y="150.0" width="170.0" height="80.0" rx="12" fill="#E2E6F0" stroke="#22315F" stroke-width="1.8"/><text x="115.0" y="184.7" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">4장 경계 기록표의</text><text x="115.0" y="206.9" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">결과 열</text><rect x="30.0" y="270.0" width="170.0" height="80.0" rx="12" fill="#E2E6F0" stroke="#22315F" stroke-width="1.8"/><text x="115.0" y="304.7" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">10장 작성표의</text><text x="115.0" y="326.9" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">기준에 없던 문제</text><rect x="236.0" y="210.0" width="110.0" height="80.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="291.0" y="256.0" fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle">실패 한 건</text><path d="M205.0,190.0 C217.0,190.0 217.0,250.0 229.0,250.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M205.0,310.0 C217.0,310.0 217.0,250.0 229.0,250.0" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><rect x="380.0" y="200.0" width="140.0" height="100.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="450.0" y="246.5" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">실패 카드</text><text x="450.0" y="2