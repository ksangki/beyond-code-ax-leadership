<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="심사 6주 전부터 자료가 위원회로 들어오는 경로와 따로 보관하는 상향 설문" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>심사 6주 전부터 자료가 위원회로 들어오는 경로와 따로 보관하는 상향 설문</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="620" fill="#F4F5F8"/><line x1="62" y1="105" x2="62" y2="305" stroke="#22315F" stroke-width="2.4"/><circle cx="62" cy="105" r="8" fill="#22315F"/><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="78.0" y="95.0">심사 6주 전</tspan></text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="78.0" y="117.0">자료 요청</tspan></text><circle cx="62" cy="205" r="8" fill="#22315F"/><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="78.0" y="195.0">심사 2주 전</tspan></text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="78.0" y="217.0">자료 마감</tspan></text><circle cx="62" cy="305" r="8" fill="#22315F"/><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="78.0" y="295.0">심사일</tspan></text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="78.0" y="317.0">위원회</tspan></text><rect x="430.0" y="270.0" width="300.0" height="70.0" rx="12" fill="#E2E6F0" stroke="#22315F" stroke-width="2.4"/><text x="580.0" y="311.8" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">승진 심사 위원회</text><rect x="200.0" y="60.0" width="140.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="270.0" y="101.5" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">보낸 관리자 기록</text><text x="270.0" y="122.0" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">18장</text><defs><marker id="m0x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><path d="M270.0,157 C270.0,215 470,205 470,262" fill="none" stroke="#A87814" stroke-width="2.6" marker-end="url(#m0x)"/><rect x="355.0" y="60.0" width="140.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="425.0" y="101.5" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">도운 일 카드</text><text x="425.0" y="122.0" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">19장, 받은 팀 작성</text><path d="M425.0,157 C425.0,215 525,205 525,262" fill="none" stroke="#A87814" stroke-width="2.6" marker-end="url(#m0x)"/><rect x="510.0" y="60.0" width="140.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="580.0" y="101.7" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">후임 후보에게</text><text x="580.0" y="121.2" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">맡긴 역할과 결과</text><path d="M580.0,157 C580.0,215 580,205 580,262" fill="none" stroke="#A87814" stroke-width="2.6" marker-end="url(#m0x)"/><rect x="665.0" y="60.0" width="140.0" height="92.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="735.0" y="111.4" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">협업 · 위임 경험</text><path d="M735.0,157 C735.0,215 635,205 635,262" fill="none" stroke="#A87814" stroke-width="2.6" marker-end="url(#m0x)"/><rect x="820.0" y="60.0" width="140.0" height="92.0" rx="12" fill="#F4F5F8" stroke="#B8BFCE" stroke-width="1.8" stroke-dasharray="7 5"/><text x="890.0" y="101.5" fill="#141C3C" font-size="14.5" font-weight="700" text-anchor="middle">후보 본인 서술</text><text x="890.0" y="122.0" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">보조</text><defs><marker id="m1x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5C6582"/></marker></defs><path d="M890.0,157 C890.0,215 690,205 690,262" fill="none" stroke="#5C6582" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#m1x)"/><rect x="230.0" y="470.0" width="200.0" height="64.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="330.0" y="507.8" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">상향 설문 원 응답</text><rect x="530.0" y="460.0" width="200.0" height="84.0" rx="12" fill="#E6E8EE" stroke="#141C3C" stroke-width="2.2"/><text x="630.0" y="497.9" fill="#141C3C" font-size="15.5" font-weight="700" text-anchor="middle">HR 분리 보관함</text><text x="630.0" y="518.7" fill="#5C6582" font-size="12.5" font-weight="400" text-anchor="middle">원 응답은 위원회가 보지 않는다</text><defs><marker id="m2x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker></defs><path d="M436,502 L523,502" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m2x)"/><path d="M630,455 L630,348" fill="none" stroke="#A87814" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#m0x)"/><text fill="#A87814" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="646.0" y="400.0">후보가 바꾼 것 한 줄만</tspan></text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="590.0">일정과 분리 보관은 이 책의 제안. 점선은 보조 자료와 한 줄만 들어가는 경로.</tspan></text></svg>