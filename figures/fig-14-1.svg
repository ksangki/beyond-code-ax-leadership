<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="지명 배치 경로와 공개 게시 경로, 그리고 보낸 관리자의 평가 자료" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>지명 배치 경로와 공개 게시 경로, 그리고 보낸 관리자의 평가 자료</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="540" fill="#F4F5F8"/><text fill="#22315F" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="395.0" y="36.0">사람이 자리에 닿는 경로</tspan></text><text fill="#A87814" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="830.0" y="36.0">이동 뒤 보낸 관리자 쪽에 남는 것</tspan></text><rect x="45.8" y="135.8" width="88.5" height="28.5" rx="14.25" fill="#22315F" stroke="#22315F" stroke-width="1.4"/><text fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="90.0" y="150.5">지명 배치</tspan></text><rect x="150.0" y="120.0" width="90.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="195.0" y="155.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">빈자리</text><rect x="270.0" y="120.0" width="260.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="400.0" y="155.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">관리자가 아는 사람을 지명</text><rect x="560.0" y="120.0" width="80.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="600.0" y="155.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">이동</text><defs><marker id="m0x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker></defs><path d="M244,150 L263,150" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><path d="M534,150 L553,150" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><rect x="700.0" y="62.0" width="260.0" height="82.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="830.0" y="88.2" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">보낸 관리자의 평가 자료에 기록이</text><text x="830.0" y="108.5" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">붙는다</text><text x="830.0" y="129.6" fill="#5C6582" font-size="13" font-weight="400" text-anchor="middle">받은 팀의 결과, 옮긴 뒤 1년</text><rect x="700.0" y="156.0" width="260.0" height="82.0" rx="12" fill="#E6E8EE" stroke="#E6E8EE" stroke-width="1.8"/><text x="830.0" y="192.3" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">기록이 붙지 않는다</text><text x="830.0" y="213.5" fill="#5C6582" font-size="13" font-weight="400" text-anchor="middle">보낸 팀의 손실만 남는다</text><defs><marker id="m1x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><path d="M645,150 C672.5,150 672.5,103.0 693,103.0" fill="none" stroke="#A87814" stroke-width="2.6" marker-end="url(#m1x)"/><defs><marker id="m2x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#5C6582"/></marker></defs><path d="M645,150 C672.5,150 672.5,197.0 693,197.0" fill="none" stroke="#5C6582" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m2x)"/><rect x="45.8" y="385.8" width="88.5" height="28.5" rx="14.25" fill="#22315F" stroke="#22315F" stroke-width="1.4"/><text fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="90.0" y="400.5">공개 게시</tspan></text><rect x="150.0" y="370.0" width="90.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="195.0" y="405.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">빈자리</text><rect x="270.0" y="370.0" width="110.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="325.0" y="405.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">공개 게시</text><rect x="410.0" y="370.0" width="120.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="470.0" y="405.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">지원자 비교</text><rect x="560.0" y="370.0" width="80.0" height="60.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="600.0" y="405.6" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">이동</text><path d="M244,400 L263,400" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><path d="M384,400 L403,400" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><path d="M534,400 L553,400" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#m0x)"/><rect x="700.0" y="312.0" width="260.0" height="82.0" rx="12" fill="#F5E9CC" stroke="#A87814" stroke-width="2.5"/><text x="830.0" y="338.2" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">보낸 관리자의 평가 자료에 기록이</text><text x="830.0" y="358.5" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">붙는다</text><text x="830.0" y="379.6" fill="#5C6582" font-size="13" font-weight="400" text-anchor="middle">받은 팀의 결과, 옮긴 뒤 1년</text><rect x="700.0" y="406.0" width="260.0" height="82.0" rx="12" fill="#E6E8EE" stroke="#E6E8EE" stroke-width="1.8"/><text x="830.0" y="442.4" fill="#141C3C" font-size="15" font-weight="700" text-anchor="middle">기록이 붙지 않는다</text><text x="830.0" y="463.5" fill="#5C6582" font-size="13" font-weight="400" text-anchor="middle">보낸 팀의 손실만 남는다</text><path d="M645,400 C672.5,400 672.5,353.0 693,353.0" fill="none" stroke="#A87814" stroke-width="2.6" marker-end="url(#m1x)"/><path d="M645,400 C672.5,400 672.5,447.0 693,447.0" fill="none" stroke="#5C6582" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#m2x)"/><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="395.0" y="275.0">경로 비교: 공개 게시 쪽 결과가 좋았다(Keller 2018, AI 이전)</tspan></text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="830.0" y="265.9">기록을 붙이는 제도의 효과 연구는 찾지</tspan><tspan x="830.0" y="284.1">못했다(2026-11-14)</tspan></text><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="520.0">왼쪽 경로 비교는 연구가 받치고, 오른쪽 갈림길은 이 장이 제안하는 설계다.</tspan></text></svg>