<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="결정한 날부터 1년 재검토까지, 임원 자리 여덟 장의 지표가 들어오는 자리" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>결정한 날부터 1년 재검토까지, 임원 자리 여덟 장의 지표가 들어오는 자리</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="470" fill="#F4F5F8"/><defs><marker id="m0x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#22315F"/></marker></defs><path d="M40,86 L962,86" fill="none" stroke="#22315F" stroke-width="2.4" marker-end="url(#m0x)"/><line x1="155.0" y1="86" x2="155.0" y2="386" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="385.0" y1="86" x2="385.0" y2="386" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="615.0" y1="86" x2="615.0" y2="386" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="845.0" y1="86" x2="845.0" y2="386" stroke="#B8BFCE" stroke-width="1.2" stroke-dasharray="5 5"/><text fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="155.0" y="48.0">결정한 날</tspan></text><circle cx="155.0" cy="86" r="9" fill="#22315F"/><rect x="50.0" y="112.0" width="210.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="155.0" y="154.4" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">사안 목록 행 작성: 결정</text><text x="155.0" y="173.3" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">문장 · Type · 근거 ·</text><text x="155.0" y="192.2" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">예상 · 실패 이유 한 줄</text><text fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="385.0" y="48.0">30일 점검</tspan></text><circle cx="385.0" cy="86" r="9" fill="#22315F"/><rect x="280.0" y="112.0" width="210.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="385.0" y="163.8" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">여는 사람과 공개할 곳 확인,</text><text x="385.0" y="182.7" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">25장 등록부 첫 점검</text><rect x="362.9" y="239.7" width="44.3" height="24.7" rx="12.35" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="385.0" y="252.5">25장</tspan></text><text fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="615.0" y="48.0">분기 경영 회의</tspan></text><circle cx="615.0" cy="86" r="9" fill="#22315F"/><rect x="510.0" y="112.0" width="210.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="615.0" y="154.4" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">3장 기준선 초과 팀 수, 17장</text><text x="615.0" y="173.3" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">사용처 안건, 18장 월 지표</text><text x="615.0" y="192.2" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">누적</text><rect x="542.9" y="239.7" width="44.3" height="24.7" rx="12.35" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="565.0" y="252.5">3장</tspan></text><rect x="592.9" y="239.7" width="44.3" height="24.7" rx="12.35" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="615.0" y="252.5">17장</tspan></text><rect x="642.9" y="239.7" width="44.3" height="24.7" rx="12.35" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="665.0" y="252.5">18장</tspan></text><text fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="845.0" y="48.0">1년 재검토</tspan></text><circle cx="845.0" cy="86" r="9" fill="#A87814"/><rect x="740.0" y="112.0" width="210.0" height="112.0" rx="10" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="845.0" y="163.8" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">2 · 19 · 23 · 29장 지표 중심,</text><text x="845.0" y="182.7" fill="#141C3C" font-size="14" font-weight="700" text-anchor="middle">전 행 유지 · 수정 · 대체</text><rect x="747.9" y="239.7" width="44.3" height="24.7" rx="12.35" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="770.0" y="252.5">2장</tspan></text><rect x="797.9" y="239.7" width="44.3" height="24.7" rx="12.35" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="820.0" y="252.5">19장</tspan></text><rect x="847.9" y="239.7" width="44.3" height="24.7" rx="12.35" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="870.0" y="252.5">23장</tspan></text><rect x="897.9" y="239.7" width="44.3" height="24.7" rx="12.35" fill="#E2E6F0" stroke="#22315F" stroke-width="1.4"/><text fill="#141C3C" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="920.0" y="252.5">29장</tspan></text><text fill="#22315F" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="50.0" y="300.0">Type 1 행: 1년 재검토까지 굵게 이어 본다</tspan></text><line x1="155.0" y1="320" x2="845.0" y2="320" stroke="#22315F" stroke-width="6"/><circle cx="155.0" cy="320" r="7" fill="#22315F"/><circle cx="845.0" cy="320" r="9" fill="#22315F"/><text fill="#A87814" font-size="14.5" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="50.0" y="350.0">Type 2 행: 분기 점검에서 고칠 수 있다</tspan></text><line x1="155.0" y1="370" x2="845.0" y2="370" stroke="#A87814" stroke-width="2"/><circle cx="155.0" cy="370" r="6" fill="#A87814"/><circle cx="615.0" cy="370" r="8" fill="#A87814"/><circle cx="845.0" cy="370" r="6" fill="#A87814"/><text fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" y="430.0">지점과 배치는 이 책의 제안, 예시</tspan></text></svg>