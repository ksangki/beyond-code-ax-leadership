<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="아낀 시간이 흩어지는 길과 기록표로 남는 길" font-family="Pretendard,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>아낀 시간이 흩어지는 길과 기록표로 남는 길</title><defs><marker id="mi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#141C3C"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#A87814"/></marker></defs><rect width="1000" height="560" fill="#F4F5F8"/><rect x="30.0" y="220.0" width="200.0" height="110.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="130.0" y="262.0" fill="#141C3C" font-size="18" font-weight="700" text-anchor="middle">개인이 아낀 시간</text><text x="130.0" y="284.6" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">정기 사용 현장 직원 42%가 주</text><text x="130.0" y="302.8" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">하루 이상</text><rect x="290" y="22" width="690" height="220" rx="14" fill="none" stroke="#B8BFCE" stroke-width="1.8" stroke-dasharray="7 6"/><text fill="#5C6582" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="306.0" y="44.0">지침이 없을 때 (현장 직원 66%가 지침을 거의 또는 전혀 받지 못함)</tspan></text><rect x="310.0" y="58.0" width="204.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="412.0" y="101.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">새 기준이 된다</text><text x="412.0" y="124.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">빨라진 만큼 기대치가 오른다</text><rect x="532.0" y="58.0" width="204.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="634.0" y="101.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">대기열이 는다</text><text x="634.0" y="124.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">검토·승인 단계에 일이 쌓인다</text><rect x="754.0" y="58.0" width="204.0" height="96.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="856.0" y="101.8" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">숨긴다</text><text x="856.0" y="124.0" fill="#5C6582" font-size="13.5" font-weight="400" text-anchor="middle">평판과 일자리 걱정</text><text fill="#5C6582" font-size="15.5" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="635.0" y="202.0">팀과 회사의 숫자에 잡히지 않는다</tspan></text><rect x="290" y="290" width="690" height="248" rx="14" fill="#F5E9CC" stroke="#A87814" stroke-width="1.8"/><text fill="#A87814" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="306.0" y="312.0">사용처 선언 + 4주 기록표</tspan></text><rect x="310.0" y="330.0" width="320.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="470.0" y="385.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">팀 안에서 쓰는 시간</text><text x="470.0" y="408.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">확인 · 배우기 · 9장에서 적은 새 일</text><rect x="650.0" y="330.0" width="310.0" height="120.0" rx="12" fill="#FFFFFF" stroke="#B8BFCE" stroke-width="1.8"/><text x="805.0" y="385.4" fill="#141C3C" font-size="17" font-weight="700" text-anchor="middle">팀 밖으로 가져가는 시간</text><text x="805.0" y="408.2" fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle">가격 · 인력 · 다른 팀 지원</text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="470.0" y="478.0">팀장이 정한다</tspan></text><text fill="#A87814" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle"><tspan x="805.0" y="478.0">임원이 기준과 시점을 정한다</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle"><tspan x="635.0" y="512.0">기록표의 숫자는 평가에 쓰지 않는다</tspan></text><path d="M236,253.0 L262,253.0 L262,106 L303,106" fill="none" stroke="#141C3C" stroke-width="2" marker-end="url(#mi)"/><path d="M236,297.0 L262,297.0 L262,390 L303,390" fill="none" stroke="#A87814" stroke-width="3" marker-end="url(#mc)"/></svg>