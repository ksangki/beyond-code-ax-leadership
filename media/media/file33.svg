ont-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="423.0" y="222.0">근무시간 5.4% 절약</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="282.0">경제 전체(조사)</tspan></text><text fill="#5C6582" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="304.0">St. Louis Fed, 전체 근로자 기준</tspan></text><rect x="330.0" y="276.0" width="21.0" height="32.0" rx="4" fill="#A87814" stroke="none" stroke-width="0"/><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="363.0" y="292.0">1.4%</tspan></text><text fill="#141C3C" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="352.0">노동시장(행정 자료)</tspan></text><text fill="#5C6582" font-size="13" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="374.0">Humlum &amp; Vestergaard, 2026-03판</tspan></text><rect x="330.0" y="346.0" width="30.0" height="32.0" rx="4" fill="#F5E9CC" stroke="#A87814" stroke-width="1.6" stroke-dasharray="6 5"/><text fill="#141C3C" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="372.0" y="362.0">임금·근로시간 효과 2% 초과 배제</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="450.0">측정 대상이 서로 달라 한 줄로 비교할 수는 없다. 방향만 본다: 단위가 커질수록 숫자가 작아진다.</tspan></text><text fill="#5C6582" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" y="474.0">품질 18% 향상(Noy &amp; Zhang)과 판본 정보는 표 4-1 참고.</tspan></text></svg>